<title>Jarvis — Client Navigation Workflow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

.ctrl-btn:hover{background:#00FF88;color:#0A0E1A}
.ctrl-btn.back{color:#00D4FF}
.ctrl-btn.back:hover{background:#00D4FF;color:#0A0E1A}

</head>
<body>

<div class="header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
<div>
<h1>JARVIS — CLIENT NAVIGATION WORKFLOW</h1>
<div class="sub">Full stage-by-stage journey, login to ongoing assessment, with review loops and branch points — captured 11 July 2026</div>
</div>
<div class="header-controls">
<a class="ctrl-btn back" href="https://sizzler-controlcentre-nksu.vercel.app/">&larr; Control Centre</a>
<button class="ctrl-btn" onclick="toggleFS()">&#10021; Full Screen</button>
</div>
</div>

<div class="legend">
<span><span class="dot" style="background:#00D4FF"></span>One-time only</span>
<span><span class="dot" style="background:#B388FF"></span>Client decision point</span>
<span><span class="dot" style="background:#FFD700"></span>Review / verification loop</span>
<span><span class="dot" style="background:#00FF88"></span>Ongoing / recurring</span>
<span><span class="dot" style="background:#FF6B6B"></span>Not yet built</span>
</div>

<div class="diagram-wrap">
<svg width="1040" height="1810" viewBox="0 0 1040 1810" role="img">
<title>Jarvis client navigation workflow diagram</title>
<desc>Full client journey from login through onboarding, gather, foundation document build with review loop, feasibility gate with three outcomes, launch dashboard, implementation, and ongoing assessment loop.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- STAGE 1: LOGIN -->
<g onclick="void(0)">
<rect x="340" y="20" width="360" height="60" rx="8" fill="#111827" stroke="#00D4FF" stroke-width="1.5"/>
<text x="520" y="42" text-anchor="middle" fill="#E8F4FD" font-size="14" font-weight="700">1 · LOGIN</text>
<text x="520" y="62" text-anchor="middle" fill="#8899AA" font-size="11">Face / PIN — voice: "Jarvis, let's go"</text>
</g>
<line x1="520" y1="80" x2="520" y2="115" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STAGE 2: ONBOARDING (one-time) -->
<rect x="300" y="115" width="440" height="90" rx="8" fill="#0A1830" stroke="#00D4FF" stroke-width="2"/>
<text x="520" y="138" text-anchor="middle" fill="#00D4FF" font-size="13" font-weight="700">2 · ONBOARDING — first client only, ever</text>
<text x="520" y="158" text-anchor="middle" fill="#E8F4FD" font-size="11">Client details → Participation mode → Password</text>
<text x="520" y="176" text-anchor="middle" fill="#8899AA" font-size="10">Fully Automated / Personal Choice / A Mix — changeable anytime</text>
<text x="520" y="194" text-anchor="middle" fill="#8899AA" font-size="10">→ Verified via fresh Login before continuing</text>
<line x1="520" y1="205" x2="520" y2="240" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STAGE 3: ENTRY PORTAL (decision) -->
<rect x="300" y="240" width="440" height="70" rx="8" fill="#1A1530" stroke="#B388FF" stroke-width="2"/>
<text x="520" y="264" text-anchor="middle" fill="#B388FF" font-size="13" font-weight="700">3 · ENTRY PORTAL</text>
<text x="520" y="284" text-anchor="middle" fill="#E8F4FD" font-size="11">"What would you like to do?" — say it or tap an option</text>
<text x="520" y="300" text-anchor="middle" fill="#8899AA" font-size="9">Free-form request, classified by the Interpretation Layer</text>

<!-- Branch lines from Entry Portal -->
<line x1="440" y1="310" x2="200" y2="345" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520" y1="310" x2="520" y2="345" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="600" y1="310" x2="850" y2="345" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Branch A: Open Query -->
<rect x="60" y="345" width="280" height="130" rx="8" fill="#111827" stroke="#1E3A5F" stroke-width="1.5"/>
<text x="200" y="368" text-anchor="middle" fill="#E8F4FD" font-size="12" font-weight="700">Open Query</text>
<text x="200" y="386" text-anchor="middle" fill="#8899AA" font-size="9">Not tied to a project</text>
<text x="200" y="406" text-anchor="middle" fill="#8899AA" font-size="9">Scout researches → voice-primary answer</text>
<text x="200" y="424" text-anchor="middle" fill="#8899AA" font-size="9">Save it / Keep researching / Leave it</text>
<text x="200" y="444" text-anchor="middle" fill="#00FF88" font-size="9">→ Saved items live in Topics list</text>
<text x="200" y="462" text-anchor="middle" fill="#8899AA" font-size="9">(only appears after first save)</text>

<!-- Branch B: New Project -->
<rect x="380" y="345" width="280" height="50" rx="8" fill="#111827" stroke="#1E3A5F" stroke-width="1.5"/>
<text x="520" y="368" text-anchor="middle" fill="#E8F4FD" font-size="12" font-weight="700">New Project</text>
<text x="520" y="386" text-anchor="middle" fill="#8899AA" font-size="9">New client → onboarding first · existing client → straight here</text>

<!-- Branch C: Existing Project -->
<rect x="700" y="345" width="280" height="130" rx="8" fill="#111827" stroke="#1E3A5F" stroke-width="1.5"/>
<text x="840" y="368" text-anchor="middle" fill="#E8F4FD" font-size="12" font-weight="700">Existing Project (Resume)</text>
<text x="840" y="386" text-anchor="middle" fill="#8899AA" font-size="9">Stage breadcrumb · tools grid · priority list</text>
<text x="840" y="404" text-anchor="middle" fill="#8899AA" font-size="9">"While you were away" summary</text>
<text x="840" y="424" text-anchor="middle" fill="#FFD700" font-size="9">Click flagged doc → Editing Tool</text>
<text x="840" y="442" text-anchor="middle" fill="#8899AA" font-size="9">re-enters the review loop below</text>
<text x="840" y="460" text-anchor="middle" fill="#8899AA" font-size="9">+ New Project → skips to here again</text>

<line x1="520" y1="395" x2="520" y2="500" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STAGE 4: GATHER -->
<rect x="300" y="500" width="440" height="110" rx="8" fill="#111827" stroke="#1E3A5F" stroke-width="1.5"/>
<text x="520" y="524" text-anchor="middle" fill="#E8F4FD" font-size="13" font-weight="700">4 · GATHER — Stage 1 of 5</text>
<text x="520" y="544" text-anchor="middle" fill="#8899AA" font-size="10">Idea · Goals · Rough costs · Upload supporting docs</text>
<text x="520" y="562" text-anchor="middle" fill="#8899AA" font-size="10">"Jarvis is reviewing in real time" — live watch indicator</text>
<text x="520" y="580" text-anchor="middle" fill="#FFD700" font-size="10">Terms &amp; Conditions — scroll-verified before Go unlocks</text>
<text x="520" y="598" text-anchor="middle" fill="#8899AA" font-size="9">Jarvis begins drafting from what's entered</text>
<line x1="520" y1="610" x2="520" y2="645" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STAGE 5: FOUNDATION DOCS BUILD -->
<rect x="260" y="645" width="520" height="140" rx="8" fill="#111827" stroke="#FFD700" stroke-width="2"/>
<text x="520" y="670" text-anchor="middle" fill="#FFD700" font-size="13" font-weight="700">5 · FOUNDATION DOCUMENTS BUILD</text>
<text x="520" y="690" text-anchor="middle" fill="#E8F4FD" font-size="10">Business Plan · Marketing Plan · SMART Goals · Financial Budget &amp; Cash Flow</text>
<text x="520" y="708" text-anchor="middle" fill="#8899AA" font-size="9">Financial: client's rough guess → Jarvis verifies real costs + risks</text>

<!-- Loop box -->
<rect x="320" y="718" width="400" height="55" rx="6" fill="#1a1810" stroke="#FFD700" stroke-width="1" stroke-dasharray="4,3"/>
<text x="520" y="736" text-anchor="middle" fill="#FFD700" font-size="9" font-weight="700">REVIEW LOOP — repeats up to 3 rounds</text>
<text x="520" y="752" text-anchor="middle" fill="#8899AA" font-size="9">Self-check → Sage (gap/conflict) → Ellis (continuity)</text>
<text x="520" y="766" text-anchor="middle" fill="#8899AA" font-size="9">Flagged sections only shown to client, never the whole doc</text>

<path d="M 720 745 C 780 745 780 690 720 680" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<text x="795" y="715" fill="#FFD700" font-size="9" text-anchor="middle">unresolved →</text>
<text x="795" y="727" fill="#FFD700" font-size="9" text-anchor="middle">re-ask client</text>

<line x1="520" y1="785" x2="520" y2="825" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STAGE 6: FEASIBILITY -->
<rect x="280" y="825" width="480" height="130" rx="8" fill="#1A1530" stroke="#B388FF" stroke-width="2"/>
<text x="520" y="850" text-anchor="middle" fill="#B388FF" font-size="13" font-weight="700">6 · FEASIBILITY PAGE — final launch gate</text>
<text x="520" y="870" text-anchor="middle" fill="#E8F4FD" font-size="10">All four docs summarised · Go/No-go six questions re-scored</text>
<text x="520" y="888" text-anchor="middle" fill="#8899AA" font-size="9">against real data — probability of success shown</text>
<text x="520" y="906" text-anchor="middle" fill="#8899AA" font-size="9">Flips once, then freezes — same pattern as the SOW</text>
<text x="520" y="928" text-anchor="middle" fill="#B388FF" font-size="10" font-weight="700">Client decides: Reject · Hold · Go</text>

<!-- Branch lines from Feasibility -->
<line x1="380" y1="955" x2="180" y2="1000" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520" y1="955" x2="520" y2="1000" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="660" y1="955" x2="860" y2="1000" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- REJECT -->
<rect x="40" y="1000" width="280" height="90" rx="8" fill="#111827" stroke="#8899AA" stroke-width="1.5"/>
<text x="180" y="1024" text-anchor="middle" fill="#8899AA" font-size="12" font-weight="700">REJECT</text>
<text x="180" y="1044" text-anchor="middle" fill="#8899AA" font-size="9">Archived immediately</text>
<text x="180" y="1060" text-anchor="middle" fill="#8899AA" font-size="9">No 6-month window</text>
<text x="180" y="1076" text-anchor="middle" fill="#8899AA" font-size="9">Summary + IP file saved to Rex</text>

<!-- HOLD (loop) -->
<rect x="380" y="1000" width="280" height="140" rx="8" fill="#2a2410" stroke="#FFD700" stroke-width="1.5"/>
<text x="520" y="1024" text-anchor="middle" fill="#FFD700" font-size="12" font-weight="700">HOLD</text>
<text x="520" y="1044" text-anchor="middle" fill="#E8F4FD" font-size="9">6-month window from hold date</text>
<text x="520" y="1062" text-anchor="middle" fill="#8899AA" font-size="9">Reactivate → ALL docs re-verified,</text>
<text x="520" y="1076" text-anchor="middle" fill="#8899AA" font-size="9">new data checked, never assumed</text>
<text x="520" y="1096" text-anchor="middle" fill="#8899AA" font-size="9">No activity, or client closes it →</text>
<text x="520" y="1112" text-anchor="middle" fill="#FF6B6B" font-size="9">Permanent stop</text>
<text x="520" y="1130" text-anchor="middle" fill="#8899AA" font-size="9">Reactivate after permanent → restart from Gather</text>

<path d="M 520 1000 C 520 960 460 940 400 955" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<text x="330" y="945" fill="#FFD700" font-size="9" text-anchor="middle">reactivated</text>
<text x="330" y="957" fill="#FFD700" font-size="9" text-anchor="middle">within window</text>

<!-- GO -->
<rect x="720" y="1000" width="280" height="90" rx="8" fill="#0A2A1A" stroke="#00FF88" stroke-width="1.5"/>
<text x="860" y="1024" text-anchor="middle" fill="#00FF88" font-size="12" font-weight="700">GO</text>
<text x="860" y="1044" text-anchor="middle" fill="#8899AA" font-size="9">Feasibility page locks and freezes</text>
<text x="860" y="1060" text-anchor="middle" fill="#8899AA" font-size="9">Moves to Implementation</text>
<text x="860" y="1076" text-anchor="middle" fill="#8899AA" font-size="9">Relay activates the pipeline</text>

<line x1="860" y1="1090" x2="860" y2="1140" stroke="#1E3A5F" stroke-width="1.5"/>
<line x1="860" y1="1140" x2="520" y2="1140" stroke="#1E3A5F" stroke-width="1.5"/>
<line x1="520" y1="1140" x2="520" y2="1175" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STAGE 7: LAUNCH DASHBOARD -->
<rect x="220" y="1175" width="600" height="230" rx="8" fill="#0A1830" stroke="#00D4FF" stroke-width="2"/>
<text x="520" y="1200" text-anchor="middle" fill="#00D4FF" font-size="13" font-weight="700">7 · LAUNCH DASHBOARD — now in Implementation</text>
<text x="520" y="1220" text-anchor="middle" fill="#8899AA" font-size="9">Seven grouped sections, tickable lists with visual previews</text>

<text x="290" y="1250" fill="#E8F4FD" font-size="10" font-weight="700">Identity &amp; Brand</text>
<text x="290" y="1266" fill="#8899AA" font-size="8">Brand Kit (Mark)</text>
<text x="290" y="1290" fill="#E8F4FD" font-size="10" font-weight="700">Legal &amp; Compliance</text>
<text x="290" y="1306" fill="#8899AA" font-size="8">Registration, permits, OHS, insurance</text>

<text x="520" y="1250" fill="#E8F4FD" font-size="10" font-weight="700" text-anchor="middle">Money</text>
<text x="520" y="1266" fill="#8899AA" font-size="8" text-anchor="middle">Banking, invoicing, procurement</text>
<text x="520" y="1290" fill="#E8F4FD" font-size="10" font-weight="700" text-anchor="middle">People</text>
<text x="520" y="1306" fill="#8899AA" font-size="8" text-anchor="middle">Staffing package</text>

<text x="750" y="1250" fill="#E8F4FD" font-size="10" font-weight="700" text-anchor="end">Operations</text>
<text x="750" y="1266" fill="#8899AA" font-size="8" text-anchor="end">Setup, distribution</text>
<text x="750" y="1290" fill="#E8F4FD" font-size="10" font-weight="700" text-anchor="end">Sell Online / Get the Word Out</text>
<text x="750" y="1306" fill="#8899AA" font-size="8" text-anchor="end">Website, marketing execution</text>

<rect x="270" y="1325" width="500" height="65" rx="6" fill="#111827" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="4,3"/>
<text x="520" y="1345" text-anchor="middle" fill="#B388FF" font-size="9" font-weight="700">TWO FLOW TYPES, per item</text>
<text x="520" y="1362" text-anchor="middle" fill="#8899AA" font-size="8">A — from foundation docs: Review → Recommend → Edit → Confirm</text>
<text x="520" y="1376" text-anchor="middle" fill="#8899AA" font-size="8">B — external research: 3 options found, one recommended</text>

<text x="520" y="1398" text-anchor="middle" fill="#8899AA" font-size="8">Both end at Rex (final version) → Ada's Library (catalogued)</text>

<line x1="520" y1="1405" x2="520" y2="1440" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STAGE 8: IMPLEMENTATION -->
<rect x="300" y="1440" width="440" height="80" rx="8" fill="#111827" stroke="#FF6B6B" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="520" y="1465" text-anchor="middle" fill="#FF6B6B" font-size="13" font-weight="700">8 · IMPLEMENTATION — Phase 3/4</text>
<text x="520" y="1485" text-anchor="middle" fill="#8899AA" font-size="10">Actual build of what was selected on the Launch Dashboard</text>
<text x="520" y="1503" text-anchor="middle" fill="#FF6B6B" font-size="9">Not yet built — named and gated, mechanism pending</text>

<line x1="520" y1="1520" x2="520" y2="1555" stroke="#1E3A5F" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- STAGE 9: ONGOING ASSESSMENT -->
<rect x="260" y="1555" width="520" height="120" rx="8" fill="#0A2A1A" stroke="#00FF88" stroke-width="2"/>
<text x="520" y="1580" text-anchor="middle" fill="#00FF88" font-size="13" font-weight="700">9 · ONGOING ASSESSMENT — Stage 5, RADAR</text>
<text x="520" y="1600" text-anchor="middle" fill="#E8F4FD" font-size="10">Weekly / monthly / quarterly / yearly health check</text>
<text x="520" y="1618" text-anchor="middle" fill="#8899AA" font-size="9">Gaps identified, fixes recommended</text>
<text x="520" y="1636" text-anchor="middle" fill="#8899AA" font-size="9">e.g. Distribution rescaled as targets are hit —</text>
<text x="520" y="1652" text-anchor="middle" fill="#8899AA" font-size="9">living room → bigger space → warehouse</text>

<path d="M 780 1615 C 900 1615 900 900 780 890" fill="none" stroke="#00FF88" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<text x="930" y="1250" fill="#00FF88" font-size="9" text-anchor="middle" transform="rotate(-90 930 1250)">Ongoing loop — RADAR revisits the whole project as it grows, not a one-time check</text>

<!-- FOOTER -->
<rect x="0" y="1720" width="1040" height="1" fill="#1E3A5F"/>
<text x="520" y="1755" text-anchor="middle" fill="#8899AA" font-size="10" font-style="italic">Captured 11 July 2026 — reflects the full onboarding-to-working navigation as built to date.</text>
<text x="520" y="1773" text-anchor="middle" fill="#8899AA" font-size="10" font-style="italic">Stage 8 (Implementation) is named and gated but not yet mechanically built.</text>
<text x="520" y="1791" text-anchor="middle" fill="#8899AA" font-size="10" font-style="italic">Launch Dashboard's 12 items: only Brand Kit's tick-list is fully proven — the rest follow the same two-type pattern.</text>

</svg>
</div>
